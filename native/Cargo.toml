[package]
name = "zoka-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "zoka_mobile"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
# Para leer la lista de hashes que llega del lado Java en un solo cruce de la
# frontera JNI. Son cientos: pasarlos de a uno seria repetir el problema que el
# pedido en lote existe para resolver.
serde_json = "1"
# `mobile` makes the trusted-setup params load WITHOUT the per-point subgroup
# check (params are digest-verified APK assets) — turns a ~minutes cold load
# into seconds on-device. `randomx` stays off (no mining on the phone).
zoka = { path = "../..", default-features = false, features = ["mobile"] }

# Tor embebido, solo en el crate de Android.
#
# Va aca y no en el crate del nodo a proposito: el nodo de escritorio ya habla
# Tor por un proxy SOCKS externo y no tiene por que cargar con un cliente Tor
# adentro. El telefono si lo necesita -- no hay un Tor del sistema al que
# recurrir --, asi que Arti se levanta en el proceso y expone SOCKS local, que
# es exactamente lo que el nodo espera.
#
# Medido: 0,8 MB en armeabi-v7a. "bundled" compila SQLite desde el fuente
# porque Android no trae libsqlite3 para el enlazador del NDK, y Arti lo usa
# para su cache de directorios.
arti-client = { version = "0.45", default-features = false, features = ["tokio", "rustls", "onion-service-client"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tor-rtcompat = "0.45"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros"] }

# Aggressive release optimization for the on-device Groth16 prover. This is a
# standalone crate (not a workspace member), so its own [profile.release]
# governs the .so. LTO + a single codegen unit let the optimizer inline across
# the crypto crates (bellman/bls12_381/curve25519), which is where the proving
# time is spent. opt-level=3 is the release default but pinned here explicitly.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

